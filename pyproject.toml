[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "avops-agent-team"
version = "0.1.0"
description = "Enterprise AV Operations — Webex Support Agents on AWS"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # Webex SDK
    "webexpythonsdk>=2.0.0",
    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # Claude API (Anthropic)
    "anthropic>=0.28.0",
    # Utilities
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "tenacity>=8.4.0",
    "structlog>=24.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",       # HTTPX test client for FastAPI
    "moto[dynamodb,s3,sqs,secretsmanager]>=5.0.0",  # AWS mock
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "boto3-stubs[dynamodb,s3,sqs,secretsmanager]>=1.34.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avops*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["avops", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["avops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
